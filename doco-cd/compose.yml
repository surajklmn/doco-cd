services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.125.1:latest
    restart: unless-stopped

    environment:
      TZ: Asia/Kathmandu
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: auto
      POLL_CONFIG: |
        - url: git@github.com:surajklmn/doco-cd.git
          reference: main
          interval: 300

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  volumes:
    data:


